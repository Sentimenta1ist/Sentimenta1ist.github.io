<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Translate — EN → RU</title>
<style>
  :root { --bg:#111418; --panel:#1a1f26; --fg:#e8ecf1; --muted:#8a94a3; --accent:#4fd1a5; --red:#ff6b6b; --size:22px; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 16px; background:var(--panel); border-bottom:1px solid #2a313b; }
  button, select { background:#252c36; color:var(--fg); border:1px solid #333c48; border-radius:8px; padding:8px 14px; font-size:15px; cursor:pointer; }
  button.primary { background:var(--accent); color:#0b1a14; border:none; font-weight:600; }
  button.primary.on { background:var(--red); color:#fff; }
  .status { margin-left:auto; color:var(--muted); font-size:14px; display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#555; }
  .dot.live { background:var(--red); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  #feed { flex:1; overflow-y:auto; padding:16px 20px 8px; }
  .seg { margin-bottom:18px; }
  .seg .en { color:var(--muted); font-size:calc(var(--size) * .75); line-height:1.35; }
  .seg .ru { font-size:var(--size); line-height:1.35; margin-top:2px; }
  .seg .ru.pending { color:#5d6673; }
  #interim { padding:10px 20px 16px; min-height:56px; color:var(--muted); font-style:italic; font-size:calc(var(--size) * .8); border-top:1px solid #2a313b; background:var(--panel); }
  #warn { display:none; padding:10px 16px; background:#3a2a12; color:#ffd28a; font-size:14px; }
  label { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<header>
  <button id="toggle" class="primary">▶ Слушать</button>
  <label>Язык речи
    <select id="srcLang">
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
    </select>
  </label>
  <label>Перевод на
    <select id="tgtLang">
      <option value="ru">Русский</option>
      <option value="uk">Українська</option>
    </select>
  </label>
  <button id="smaller">A−</button>
  <button id="bigger">A+</button>
  <button id="clear">Очистить</button>
  <button id="copy">Копировать всё</button>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">остановлено</span></div>
</header>
<div id="warn"></div>
<div id="feed"></div>
<div id="interim"></div>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const $ = id => document.getElementById(id);
const feed = $('feed'), interimEl = $('interim'), warn = $('warn');
let rec = null, listening = false, size = 22;
let engine = 'none', translator = null, translatorPair = '';

function showWarn(msg) { warn.textContent = msg; warn.style.display = 'block'; }
function setStatus(text, live) { $('statusText').textContent = text; $('dot').classList.toggle('live', !!live); }

if (!SR) showWarn('Этот браузер не поддерживает распознавание речи. Открой страницу в Google Chrome на компьютере.');

// ---------- Translation ----------
async function ensureTranslator(src, tgt) {
  const pair = src + '>' + tgt;
  if (translatorPair === pair && engine !== 'none') return;
  translatorPair = pair; translator = null; engine = 'google';
  try {
    if ('Translator' in self) {
      const avail = await Translator.availability({ sourceLanguage: src, targetLanguage: tgt });
      if (avail !== 'unavailable') {
        translator = await Translator.create({ sourceLanguage: src, targetLanguage: tgt });
        engine = 'builtin';
      }
    }
  } catch (e) { translator = null; engine = 'google'; }
}

async function translate(text, tgt) {
  if (engine === 'builtin' && translator) {
    try { return await translator.translate(text); } catch (e) { engine = 'google'; }
  }
  try {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=' + tgt + '&dt=t&q=' + encodeURIComponent(text);
    const r = await fetch(url);
    const j = await r.json();
    return j[0].map(p => p[0]).join('');
  } catch (e) {}
  try {
    const r = await fetch('https://api.mymemory.translated.net/get?langpair=en|' + tgt + '&q=' + encodeURIComponent(text));
    const j = await r.json();
    return j.responseData.translatedText;
  } catch (e) {}
  return '⚠ перевод недоступен (нет сети?)';
}

// ---------- Feed ----------
function nearBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120; }

async function addSegment(enText) {
  const stick = nearBottom();
  const seg = document.createElement('div'); seg.className = 'seg';
  const en = document.createElement('div'); en.className = 'en'; en.textContent = enText;
  const ru = document.createElement('div'); ru.className = 'ru pending'; ru.textContent = '…';
  seg.append(en, ru); feed.appendChild(seg);
  if (stick) feed.scrollTop = feed.scrollHeight;
  const tgt = $('tgtLang').value;
  ru.textContent = await translate(enText, tgt);
  ru.classList.remove('pending');
  if (stick) feed.scrollTop = feed.scrollHeight;
}

// ---------- Recognition ----------
// Не полагаемся на isFinal (в iOS Safari он ведёт себя непредсказуемо):
// собираем весь текст сессии, а новую часть фиксируем по паузе в речи.
let committedLen = 0, pauseTimer = null, lastFull = '', paused = false, startWatch = null;
const PAUSE_MS = 1200, MAX_CHARS = 160;

function fullText(results) {
  return Array.from(results).map(r => r[0].transcript).join(' ').replace(/\s+/g, ' ').trim();
}
function commit() {
  clearTimeout(pauseTimer);
  const pending = lastFull.slice(committedLen).trim();
  committedLen = lastFull.length;
  interimEl.textContent = '';
  if (pending) addSegment(pending);
}

function buildRec() {
  const r = new SR();
  r.lang = $('srcLang').value;
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;

  r._started = false;
  r.onstart = () => {
    r._started = true;
    clearTimeout(startWatch);
    committedLen = 0; lastFull = '';
    paused = false;
    setStatus('слушаю · перевод: ' + (engine === 'builtin' ? 'встроенный Chrome' : 'Google'), true);
  };
  r.onresult = e => {
    lastFull = fullText(e.results);
    if (lastFull.length < committedLen) committedLen = 0; // движок переписал текст сессии
    const pending = lastFull.slice(committedLen).trim();
    interimEl.textContent = pending;
    const last = e.results[e.results.length - 1];
    if (last && last.isFinal && pending.length > 40) { commit(); return; }
    if (pending.length > MAX_CHARS) { commit(); return; }
    clearTimeout(pauseTimer);
    pauseTimer = setTimeout(commit, PAUSE_MS);
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      if (listening && rec === r && committedLen === 0 && !lastFull) {
        showWarn('Нет доступа к микрофону. Разреши микрофон для этой страницы и нажми «Слушать» снова.');
      }
    } else if (e.error === 'network') {
      setStatus('нет сети, переподключаюсь…', true);
    }
  };
  r.onend = () => {
    commit();
    if (!listening || rec !== r) return;
    if (!r._started) { showPaused(); return; } // перезапуск не удался — не зацикливаемся
    // Пытаемся перезапуститься сами; iOS может не разрешить без нажатия
    try {
      rec = buildRec();
      rec.start();
      startWatch = setTimeout(showPaused, 1500);
    } catch (e) { showPaused(); }
  };
  return r;
}

function showPaused() {
  if (!listening) return;
  paused = true;
  $('toggle').textContent = '▶ Продолжить'; $('toggle').classList.remove('on');
  setStatus('пауза — нажми «Продолжить»', false);
}

function start() {
  if (!SR) return;
  warn.style.display = 'none';
  listening = true; paused = false;
  rec = buildRec();
  try { rec.start(); } catch (e) {}   // старт сразу в обработчике нажатия — важно для iOS
  $('toggle').textContent = '■ Стоп'; $('toggle').classList.add('on');
  setStatus('запускаю…', true);
  ensureTranslator('en', $('tgtLang').value);
}

function stop() {
  listening = false; paused = false;
  clearTimeout(startWatch);
  const r = rec; rec = null;
  if (r) { try { r.stop(); } catch (e) {} }
  commit();
  $('toggle').textContent = '▶ Слушать'; $('toggle').classList.remove('on');
  setStatus('остановлено', false);
}

$('toggle').onclick = () => (listening && !paused) ? stop() : start();
$('srcLang').onchange = () => { if (listening) { stop(); start(); } };
$('tgtLang').onchange = async () => { translatorPair = ''; await ensureTranslator('en', $('tgtLang').value); };
$('bigger').onclick = () => { size = Math.min(48, size + 2); document.documentElement.style.setProperty('--size', size + 'px'); };
$('smaller').onclick = () => { size = Math.max(14, size - 2); document.documentElement.style.setProperty('--size', size + 'px'); };
$('clear').onclick = () => { feed.innerHTML = ''; };
$('copy').onclick = async () => {
  const text = [...feed.querySelectorAll('.seg')].map(s => s.querySelector('.en').textContent + '\n' + s.querySelector('.ru').textContent).join('\n\n');
  try { await navigator.clipboard.writeText(text); $('copy').textContent = 'Скопировано ✓'; setTimeout(() => $('copy').textContent = 'Копировать всё', 1500); } catch (e) {}
};
</script>
</body>
</html>
